services:
  postgres:
    image: postgres:16-alpine
    container_name: astraos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-astraos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-astraos}
      POSTGRES_DB: ${POSTGRES_DB:-astraos}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - astraos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-astraos} -d ${POSTGRES_DB:-astraos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: astraos-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - astraos_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-lc", "</dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  astraos_postgres_data:
  astraos_qdrant_data:
